name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (Rust 1.75.0)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75.0"

      # thiserror 2.0.21 (via logp and pare) requires rustc 1.77; the library
      # builds at the declared 1.75 with 2.0.20. Library lockfiles are not
      # committed, so pin it for this lane.
      - name: pin thiserror below its 1.77 release
        run: cargo update -p thiserror --precise 2.0.20

      # Keep this lane proportional to the published library API. Examples and
      # executable behavior stay covered by the stable test job below.
      - name: check library (no default features)
        run: cargo check -p muxer --lib --no-default-features

      - name: check library (all features)
        run: cargo check -p muxer --lib --all-features

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: rustfmt
        run: cargo fmt -p muxer --check

      - name: clippy (default)
        run: cargo clippy -p muxer --all-targets -- -D warnings

      - name: test (default)
        run: cargo test -p muxer --all-targets

      - name: run example assertions (default)
        run: |
          cargo run -p muxer --example matrix_harness
          cargo run -p muxer --example pcap_triage_harness
          cargo run -p muxer --example synthetic_drift_harness
          cargo run -p muxer --example ad_auction_harness
          cargo run -p muxer --example fraud_scoring_harness
          cargo run -p muxer --example search_ranking_harness
          cargo run -p muxer --example medical_triage_harness
          cargo run -p muxer --example deterministic_router
          cargo run -p muxer --example thompson_router
          cargo run -p muxer --example monitored_router
          cargo run -p muxer --example exp3ix_router
          cargo run -p muxer --example mab_constraints_tuning

      - name: run example assertions (contextual)
        run: |
          cargo run -p muxer --example contextual_router --features contextual
          cargo run -p muxer --example contextual_propensity_logging --features contextual

      # The unified examples exercise runtime issuance, correlated feedback,
      # policy refresh, and retained-feedback evaluation.  Compile-only target
      # checks do not execute those assertions.
      - name: run unified example assertions (default)
        run: |
          cargo run -p muxer --example unified_bernoulli
          cargo run -p muxer --example unified_quality --no-default-features
          cargo run -p muxer --example unified_external --no-default-features

      - name: run unified example assertions (contextual)
        run: |
          cargo run -p muxer --example unified_contextual --no-default-features --features contextual
          cargo run -p muxer --example unified_evaluation --no-default-features --features contextual
          cargo run -p muxer --example unified_refresh --no-default-features --features contextual

      - name: clippy (no default features)
        run: cargo clippy -p muxer --all-targets --no-default-features -- -D warnings

      - name: test (no default features)
        run: cargo test -p muxer --all-targets --no-default-features

      - name: clippy (all features)
        run: cargo clippy -p muxer --all-targets --all-features -- -D warnings

      - name: test (all features)
        run: cargo test -p muxer --all-targets --all-features

      - name: clippy (contextual, no default features)
        run: cargo clippy -p muxer --all-targets --no-default-features --features contextual -- -D warnings

      - name: test (contextual, no default features)
        run: cargo test -p muxer --all-targets --no-default-features --features contextual

      - name: clippy (serde, no default features)
        run: cargo clippy -p muxer --lib --tests --no-default-features --features serde -- -D warnings

      - name: test (serde, no default features)
        run: cargo test -p muxer --lib --tests --no-default-features --features serde

      - name: clippy (boltzmann, no default features)
        run: cargo clippy -p muxer --all-targets --no-default-features --features boltzmann -- -D warnings

      - name: test (boltzmann, no default features)
        run: |
          cargo test -p muxer --all-targets --no-default-features --features boltzmann
          cargo test -p muxer --doc --no-default-features --features boltzmann

      - name: rustdoc (boltzmann, no default features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p muxer --no-deps --no-default-features --features boltzmann

      - name: doctests (default)
        run: cargo test -p muxer --doc

      - name: doctests (all features)
        run: cargo test -p muxer --doc --all-features

      - name: rustdoc (all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p muxer --no-deps --all-features

      - name: Semver check
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-semver-checks --locked || true
          cargo semver-checks -p muxer

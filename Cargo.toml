[package]
name = "muxer"
version = "0.6.2"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = true
exclude = ["/chatgpt-export-*", "/.github", "/.gitignore"]
description = "Multi-objective bandit routing with drift detection"
repository = "https://github.com/arclabs561/muxer"
keywords = ["bandit", "routing", "llm", "pareto", "multi-objective"]
categories = ["algorithms", "science"]
homepage = "https://github.com/arclabs561/muxer"
documentation = "https://docs.rs/muxer"

[package.metadata.docs.rs]
features = ["serde", "contextual"]

[workspace]

[dependencies]
logp = "0.2"
pare = { version = "=0.2.2", features = ["serde"] }
rand = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
drawset = { version = "0.1.2", optional = true }

[dev-dependencies]
clap = "=4.5.40"
criterion = { version = "=0.5.1", default-features = false }
half = "=2.4.1"
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[features]
default = ["stochastic"]
serde = ["dep:serde"]
stochastic = ["dep:rand", "dep:rand_distr"]
contextual = ["dep:rand"]
# Boltzmann (softmax-temperature) arm selection via drawset's Gumbel-max trick.
# Adds a stochastic softmax alternative to Thompson and EXP3-IX.
boltzmann = ["dep:drawset"]

[[bench]]
name = "coverage"
harness = false

[[bench]]
name = "monitor"
harness = false

[[bench]]
name = "router_select"
harness = false

[[bench]]
name = "runtime_lifecycle"
harness = false

[[example]]
name = "unified_bernoulli"
required-features = ["stochastic"]

[[example]]
name = "unified_contextual"
required-features = ["contextual"]

[[example]]
name = "bqcd_calibrated"
required-features = ["stochastic"]

[[example]]
name = "bqcd_sampling"
required-features = ["stochastic"]

[[example]]
name = "coverage_autotune"
required-features = ["stochastic"]

[[example]]
name = "detector_calibration"
required-features = ["stochastic"]

[[example]]
name = "detector_inertia"
required-features = ["stochastic"]

[[example]]
name = "deterministic_router"
required-features = ["stochastic"]

[[example]]
name = "end_to_end_router"
required-features = ["stochastic"]

[[example]]
name = "exp3ix_router"
required-features = ["stochastic"]

[[example]]
name = "free_lunch_investigation"
required-features = ["stochastic"]

[[example]]
name = "monitored_router"
required-features = ["stochastic"]

[[example]]
name = "router_production"
required-features = ["stochastic"]

[[example]]
name = "significant_shift_sim"
required-features = ["stochastic"]

[[example]]
